<!DOCTYPE html>
<html>

<head>
    <title>Task App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card {
            border: 1px solid black;
            margin: 10px;
            box-shadow: 3px 3px gray;
            width: 175px;
        }
    </style>
</head>

<body>
    <form id="task-form">
        <div class="task-form-row">
            <input id="task-description" class="left-side" type="text" placeholder="task description" required>
            <select id="task-status" class="right-side" name="task-status">
                <option value="todo">ToDo</option>
                <option value="doing">Doing</option>
                <option value="done">Done</option>
            </select>
        </div>

        <div class="task-form-row">
            <div class="left-side"></div>
            <button class="right-side" type="submit">Add</button>
        </div>
    </form>

    <div id="tasks">
        <div class="card">
            <div class="left-side">pack spikes for track meet</div>
            <div class="todo task-status right-side">todo</div>
        </div>

        <div class="card">
            <div class="left-side">make my bed</div>
            <div class="todo task-status right-side">todo</div>
        </div>

        <div class="card">
            <div class="left-side">walk the dog</div>
            <div class="todo task-status right-side">todo</div>
        </div>

        <div class="card">
            <div class="left-side">write draft english paper</div>
            <div class="doing task-status right-side">doing</div>
        </div>

        <div class="card">
            <div class="left-side">sanding art project</div>
            <div class="doing task-status right-side">doing</div>
        </div>

        <div class="card">
            <div class="left-side">wash the dishes</div>
            <div class="done task-status right-side">done</div>
        </div>

        <div class="card">
            <div class="left-side">finish math homework</div>
            <div class="done task-status right-side">done</div>
        </div>

        <div class="card">
            <div class="left-side">practice my trumpet</div>
            <div class="done task-status right-side">done</div>
        </div>
    </div>
</body>

</html>
